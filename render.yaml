services:
  - type: web
    name: gold-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OANDA_TOKEN
        sync: false
      - key: OANDA_ACCOUNT
        sync: false
      - key: OANDA_ENV
        value: practice
      - key: TV_WEBHOOK_SECRET
        sync: false
