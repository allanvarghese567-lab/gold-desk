<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Desk</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#241d10;--mute:#7a6f58;--line:#e3dccb;--accent:#8a5a00;--up:#1f8a5b;--down:#c8403a;
--red:#e5484d;--orange:#f08a24;--yellow:#e8b923;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14110b;--panel:#1d1910;--ink:#f1e8d2;--mute:#a1957a;--line:#322b1b;--accent:#e0b04a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:12px}
h1{margin:0;font-size:18px}
#price{font-size:28px;font-weight:600;margin-left:auto}
#price.up{color:var(--up)}#price.down{color:var(--down)}
#spread{color:var(--mute);font-size:13px}
.tfs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:38px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.ghost{background:transparent;border-style:dashed;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:12px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#chart{height:52vh;min-height:320px;position:relative}
.chart-wrap{position:relative}
.analysis-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.analysis-bar label{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.analysis-bar input[type=checkbox]{accent-color:var(--accent)}
.analysis-bar input[type=range]{width:80px;vertical-align:middle}
.analysis-bar .tool{min-height:32px;padding:4px 10px;font-size:13px}
.analysis-bar .tool[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.overlay-list{max-height:100px;overflow-y:auto;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--line);display:none}
.overlay-list.show{display:block}
.overlay-list .ov{display:flex;gap:8px;align-items:center;padding:3px 0}
.overlay-list .ov button{min-height:26px;padding:2px 8px;font-size:12px}
.chart-hint{position:absolute;top:10px;left:10px;z-index:5;background:rgba(0,0,0,.55);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;display:none}
.chart-hint.show{display:block}
.next{padding:14px;border-bottom:1px solid var(--line)}
.next small{color:var(--mute);display:block}.next b{font-size:26px}
h2{font-size:14px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-weight:600}
.dot{width:11px;height:9px;border-radius:2px;display:inline-block;margin-top:6px}
.High{background:var(--red)}.Medium{background:var(--orange)}.Low{background:var(--yellow)}.Holiday{background:#9aa}
.row{display:grid;grid-template-columns:90px 12px 1fr;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.row.past{opacity:.5}.row .meta{grid-column:3;color:var(--mute);font-size:13px}
.sig{padding:9px 14px;border-bottom:1px solid var(--line)}
.buy{color:var(--up);font-weight:600}.sell{color:var(--down);font-weight:600}
#news{max-height:200px;overflow-y:auto}#sigs{max-height:140px;overflow-y:auto}
.msg{padding:14px;color:var(--mute)}
.confirm-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.confirm-head select,.confirm-head button{font:inherit;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.confirm-meta{padding:8px 14px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.confirm-decision{font-weight:700;font-size:15px}
.confirm-decision.ENTER{color:var(--up)}.confirm-decision.WAIT{color:var(--mute)}
#confirmList{max-height:220px;overflow-y:auto}
.chk{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:6px 14px;border-bottom:1px solid var(--line);font-size:13px}
.chk .mark{font-weight:700}
.chk.ok .mark{color:var(--up)}.chk.no .mark{color:var(--mute)}
.chk .code{font-weight:600;margin-right:6px}
.iframe-section{margin-top:14px}
.iframe-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.iframe-bar .label{color:var(--mute);font-size:13px;margin-right:4px}
.iframe-bar .spacer{flex:1}
.iframe-frame-wrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;height:62vh;min-height:380px}
.iframe-frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.iframe-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:var(--panel);color:var(--mute)}
.iframe-fallback.show{display:flex}
.iframe-fallback a{color:var(--accent);font-weight:600}
.add-form{display:none;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;margin-bottom:8px}
.add-form.show{display:flex}
.add-form input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:140px}
.add-form input.url{min-width:220px;flex:1}
.iframe-section:fullscreen{margin:0;padding:12px;background:var(--bg);display:flex;flex-direction:column;height:100%}
.iframe-section:fullscreen .iframe-frame-wrap{flex:1;height:auto;min-height:0;border-radius:0}
.iframe-section:-webkit-full-screen{margin:0;padding:12px;background:var(--bg);display:flex;flex-direction:column;height:100%}
.iframe-section:-webkit-full-screen .iframe-frame-wrap{flex:1;height:auto;min-height:0;border-radius:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gold Desk · XAU/USD</h1>
    <span id="spread"></span>
    <span id="price">--</span>
  </header>
  <div class="tfs" id="tfs" role="group" aria-label="Timeframe">
    <button data-g="M1" data-s="60">1m</button>
    <button data-g="M5" data-s="300">5m</button>
    <button data-g="M15" data-s="900" aria-pressed="true">15m</button>
    <button data-g="H1" data-s="3600">1h</button>
    <button data-g="H4" data-s="14400">4h</button>
    <button data-g="D" data-s="86400">1D</button>
  </div>
  <div class="grid">
    <section class="panel chart-wrap">
      <div class="analysis-bar" id="analysisBar">
        <span style="color:var(--mute);font-size:12px;margin-right:4px">Analysis</span>
        <label><input type="checkbox" id="indMA20" checked> MA20</label>
        <label><input type="checkbox" id="indMA50" checked> MA50</label>
        <label><input type="checkbox" id="indBB"> BB</label>
        <label><input type="checkbox" id="indATR"> ATR bands</label>
        <span style="width:1px;height:20px;background:var(--line);margin:0 4px"></span>
        <button type="button" class="tool" data-tool="hline" id="toolHline">H-Line</button>
        <button type="button" class="tool" data-tool="zone" id="toolZone">Zone</button>
        <button type="button" class="tool ghost" id="toolClear" title="Clear drawings">Clear</button>
        <label style="margin-left:auto">Opacity <input type="range" id="ovOpacity" min="15" max="90" value="40"></label>
      </div>
      <div class="overlay-list" id="overlayList"></div>
      <div id="chart"></div>
      <div class="chart-hint" id="chartHint">Click chart to place level</div>
    </section>
    <aside>
      <div class="panel" style="margin-bottom:12px">
        <div class="next"><small>Next red-folder USD event</small><b id="cd">--:--:--</b><div id="nt" style="color:var(--mute)">Loading…</div></div>
        <h2>USD news this week</h2><div id="news"></div>
      </div>
      <div class="panel" style="margin-bottom:12px"><h2>TradingView signals</h2><div id="sigs"><div class="msg">No alerts received yet.</div></div></div>
      <div class="panel">
        <h2>Confirmation engine</h2>
        <div class="confirm-head">
          <select id="cfSide"><option value="long">Long</option><option value="short">Short</option></select>
          <select id="cfGran">
            <option value="M15">15m</option>
            <option value="M5">5m</option>
            <option value="H1">1h</option>
            <option value="H4">4h</option>
            <option value="D">1D</option>
          </select>
          <button type="button" id="cfRun">Run</button>
        </div>
        <div class="confirm-meta" id="cfMeta">Press Run to check live XAU/USD bars.</div>
        <div id="confirmList"></div>
      </div>
    </aside>
  </div>

  <section class="iframe-section">
    <div class="iframe-bar" id="iframeBar">
      <span class="label">Workspace</span>
      <button type="button" class="ghost" id="btnAdd" title="Add custom link">+ Add</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="btnFs" title="Full screen">⛶ Full screen</button>
    </div>
    <div class="add-form" id="addForm">
      <input type="text" id="addName" placeholder="Name (e.g. My chart)" maxlength="24">
      <input type="url" id="addUrl" class="url" placeholder="https://…">
      <button type="button" id="addSave">Save</button>
      <button type="button" class="ghost" id="addCancel">Cancel</button>
    </div>
    <div class="iframe-frame-wrap">
      <iframe id="deskFrame" title="Workspace" referrerpolicy="no-referrer"></iframe>
      <div class="iframe-fallback" id="frameFallback">
        <div>This site blocks embedding in an iframe.</div>
        <a id="fallbackLink" href="#" target="_blank" rel="noopener">Open in new tab →</a>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let gran="M15", step=900, last=null, events=[], signals=[];

const dark=matchMedia("(prefers-color-scheme: dark)").matches;
const chart=LightweightCharts.createChart($("chart"),{
  autoSize:true,
  layout:{background:{color:"transparent"},textColor:dark?"#a1957a":"#7a6f58"},
  grid:{vertLines:{color:dark?"#26200f":"#eee6d2"},horzLines:{color:dark?"#26200f":"#eee6d2"}},
  timeScale:{timeVisible:true,secondsVisible:false},rightPriceScale:{borderVisible:false}});
const series=chart.addCandlestickSeries({upColor:"#1f8a5b",downColor:"#c8403a",borderVisible:false,wickUpColor:"#1f8a5b",wickDownColor:"#c8403a"});
const ma20=chart.addLineSeries({color:"#8a5a00",lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const ma50=chart.addLineSeries({color:"#5a7a8a",lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const bbUpper=chart.addLineSeries({color:"rgba(138,90,0,0.45)",lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const bbMid=chart.addLineSeries({color:"rgba(138,90,0,0.35)",lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const bbLower=chart.addLineSeries({color:"rgba(138,90,0,0.45)",lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const atrUp=chart.addLineSeries({color:"rgba(31,138,91,0.4)",lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const atrDn=chart.addLineSeries({color:"rgba(200,64,58,0.4)",lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});

let candleData=[];
let activeTool=null;
let zoneAnchor=null;
let overlays=loadOverlays();
const priceLines=[];

function loadOverlays(){
  try{return JSON.parse(localStorage.getItem("golddesk_overlays")||"[]")}catch{return []}
}
function saveOverlays(){localStorage.setItem("golddesk_overlays",JSON.stringify(overlays))}

function sma(data,n){
  const out=[];
  for(let i=0;i<data.length;i++){
    if(i+1<n) continue;
    let s=0; for(let j=i-n+1;j<=i;j++) s+=data[j].close;
    out.push({time:data[i].time,value:+(s/n).toFixed(3)});
  }
  return out;
}
function boll(data,n=20,k=2){
  const up=[],mid=[],lo=[];
  for(let i=0;i<data.length;i++){
    if(i+1<n) continue;
    const w=data.slice(i-n+1,i+1).map(d=>d.close);
    const m=w.reduce((a,b)=>a+b,0)/n;
    const sd=Math.sqrt(w.reduce((a,b)=>a+(b-m)*(b-m),0)/n);
    mid.push({time:data[i].time,value:+m.toFixed(3)});
    up.push({time:data[i].time,value:+(m+k*sd).toFixed(3)});
    lo.push({time:data[i].time,value:+(m-k*sd).toFixed(3)});
  }
  return {up,mid,lo};
}
function atrBands(data,n=14,mult=1.5){
  const tr=[];
  for(let i=0;i<data.length;i++){
    if(i===0){tr.push(data[i].high-data[i].low);continue}
    const h=data[i].high,l=data[i].low,pc=data[i-1].close;
    tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
  }
  const up=[],dn=[];
  let atr=null;
  for(let i=0;i<data.length;i++){
    if(i+1<n) continue;
    if(atr===null){atr=tr.slice(0,n).reduce((a,b)=>a+b,0)/n}
    else atr=(atr*(n-1)+tr[i])/n;
    up.push({time:data[i].time,value:+(data[i].close+mult*atr).toFixed(3)});
    dn.push({time:data[i].time,value:+(data[i].close-mult*atr).toFixed(3)});
  }
  return {up,dn};
}

function applyIndicators(){
  if(!candleData.length) return;
  const showMA20=$("indMA20").checked, showMA50=$("indMA50").checked;
  const showBB=$("indBB").checked, showATR=$("indATR").checked;
  ma20.setData(showMA20?sma(candleData,20):[]);
  ma50.setData(showMA50?sma(candleData,50):[]);
  if(showBB){const b=boll(candleData);bbUpper.setData(b.up);bbMid.setData(b.mid);bbLower.setData(b.lo)}
  else{bbUpper.setData([]);bbMid.setData([]);bbLower.setData([])}
  if(showATR){const a=atrBands(candleData);atrUp.setData(a.up);atrDn.setData(a.dn)}
  else{atrUp.setData([]);atrDn.setData([])}
}

function overlayColor(alpha){
  const a=(alpha/100).toFixed(2);
  return {line:`rgba(138,90,0,${a})`,zone:`rgba(138,90,0,${(alpha/200).toFixed(2)})`};
}
function clearPriceLines(){
  priceLines.splice(0).forEach(pl=>{try{series.removePriceLine(pl)}catch{}});
}
function redrawOverlays(){
  clearPriceLines();
  const alpha=+$("ovOpacity").value;
  const col=overlayColor(alpha);
  overlays.forEach((ov,i)=>{
    if(ov.type==="hline"){
      const pl=series.createPriceLine({price:ov.price,color:col.line,lineWidth:2,lineStyle:0,axisLabelVisible:true,title:ov.label||""});
      priceLines.push(pl);
    } else if(ov.type==="zone"){
      const pl1=series.createPriceLine({price:ov.top,color:col.line,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:ov.label||"Z"});
      const pl2=series.createPriceLine({price:ov.bottom,color:col.line,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:""});
      priceLines.push(pl1,pl2);
    }
  });
  renderOverlayList();
}
function renderOverlayList(){
  const el=$("overlayList");
  if(!overlays.length){el.classList.remove("show");el.innerHTML="";return}
  el.classList.add("show");
  el.innerHTML=overlays.map((ov,i)=>{
    if(ov.type==="hline") return `<div class="ov"><span>H ${ov.price.toFixed(2)}</span><button type="button" data-del="${i}">×</button></div>`;
    return `<div class="ov"><span>Z ${ov.bottom.toFixed(2)}–${ov.top.toFixed(2)}</span><button type="button" data-del="${i}">×</button></div>`;
  }).join("");
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    overlays.splice(+b.dataset.del,1);saveOverlays();redrawOverlays();
  });
}

function setTool(t){
  activeTool=(activeTool===t)?null:t;
  zoneAnchor=null;
  ["toolHline","toolZone"].forEach(id=>{
    const b=$(id); b.setAttribute("aria-pressed", b.dataset.tool===activeTool?"true":"false");
  });
  const hint=$("chartHint");
  if(activeTool==="hline"){hint.textContent="Click chart to place horizontal level";hint.classList.add("show")}
  else if(activeTool==="zone"){hint.textContent="Click first edge of zone";hint.classList.add("show")}
  else hint.classList.remove("show");
}
$("toolHline").onclick=()=>setTool("hline");
$("toolZone").onclick=()=>setTool("zone");
$("toolClear").onclick=()=>{overlays=[];saveOverlays();redrawOverlays();zoneAnchor=null;setTool(null)};
$("ovOpacity").oninput=()=>redrawOverlays();
["indMA20","indMA50","indBB","indATR"].forEach(id=>$(id).onchange=applyIndicators);

chart.subscribeClick(param=>{
  if(!activeTool||!param||param.time===undefined) return;
  let p=null;
  const price=param.seriesData&&param.seriesData.get(series);
  if(price&&typeof price.close==="number") p=price.close;
  try{
    const yPrice=series.coordinateToPrice(param.point.y);
    if(typeof yPrice==="number"&&!isNaN(yPrice)) p=yPrice;
  }catch{}
  if(p==null&&candleData.length) p=candleData[candleData.length-1].close;
  if(p==null) return;

  if(activeTool==="hline"){
    overlays.push({type:"hline",price:+p.toFixed(3),label:p.toFixed(1)});
    saveOverlays();redrawOverlays();
  } else if(activeTool==="zone"){
    if(zoneAnchor==null){
      zoneAnchor=p;
      $("chartHint").textContent="Click second edge of zone";
    } else {
      const top=Math.max(zoneAnchor,p), bottom=Math.min(zoneAnchor,p);
      overlays.push({type:"zone",top:+top.toFixed(3),bottom:+bottom.toFixed(3),label:"zone"});
      zoneAnchor=null;
      saveOverlays();redrawOverlays();
      $("chartHint").textContent="Click first edge of zone";
    }
  }
});

const snap=t=>Math.floor(t/step)*step;
const fmt=d=>d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});

async function loadCandles(){
  const r=await fetch(`/api/candles?granularity=${gran}&count=500`);
  if(!r.ok){$("price").textContent="check .env";return}
  const data=await r.json();
  candleData=data;
  series.setData(data);
  last=data[data.length-1];
  markers();
  applyIndicators();
  redrawOverlays();
}
function markers(){
  const m=[];
  events.forEach(e=>{
    if(!["High","Medium"].includes(e.impact))return;
    const t=snap(Math.floor(new Date(e.date)/1000));
    m.push({time:t,position:"aboveBar",shape:"square",color:e.impact==="High"?"#e5484d":"#f08a24",text:e.impact==="High"?e.title.slice(0,18):""});
  });
  signals.forEach(s=>{
    const buy=String(s.side).toLowerCase()==="buy";
    m.push({time:snap(s.t),position:buy?"belowBar":"aboveBar",shape:buy?"arrowUp":"arrowDown",color:buy?"#1f8a5b":"#c8403a",text:s.note||s.side});
  });
  m.sort((a,b)=>a.time-b.time); series.setMarkers(m);
}

let prev=null;
const es=new EventSource("/stream");
es.addEventListener("tick",ev=>{
  const d=JSON.parse(ev.data), t=snap(d.t);
  $("price").textContent=d.mid.toFixed(2);
  $("price").className=prev===null?"":(d.mid>prev?"up":"down");
  prev=d.mid;
  $("spread").textContent=(d.ask-d.bid).toFixed(2)+" spread";
  if(last && last.time===t){last.high=Math.max(last.high,d.mid);last.low=Math.min(last.low,d.mid);last.close=d.mid}
  else last={time:t,open:d.mid,high:d.mid,low:d.mid,close:d.mid};
  series.update(last);
});
es.addEventListener("signal",ev=>{signals.unshift(JSON.parse(ev.data));renderSigs();markers()});

$("tfs").onclick=e=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#tfs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  gran=b.dataset.g; step=+b.dataset.s; loadCandles();
};

async function loadNews(){
  try{
    const r=await fetch("/api/news"); if(!r.ok)throw 0;
    events=(await r.json()).sort((a,b)=>new Date(a.date)-new Date(b.date)); renderNews(); markers();
  }catch{$("news").innerHTML='<div class="msg">News feed unavailable. It retries every 15 minutes.</div>'}
}
function renderNews(){
  const now=Date.now(), rows=events.filter(e=>e.impact!=="Low"&&e.impact!=="Holiday");
  $("news").innerHTML=rows.length?rows.map(e=>{const d=new Date(e.date);
    const bits=[e.forecast&&"Forecast "+esc(e.forecast),e.previous&&"Previous "+esc(e.previous)].filter(Boolean).join(" · ");
    return `<div class="row ${d<now?"past":""}"><span>${d.toLocaleDateString([],{weekday:"short"})} ${fmt(d)}</span><span class="dot ${e.impact}"></span><span>${esc(e.title)}</span>${bits?`<span class="meta">${bits}</span>`:""}</div>`}).join("")
    :'<div class="msg">No red or orange USD events this week.</div>';
}
function tick(){
  const n=events.find(e=>e.impact==="High"&&new Date(e.date)>Date.now());
  if(!n){$("cd").textContent="None this week";$("nt").textContent="";return}
  let s=Math.floor((new Date(n.date)-Date.now())/1000),h=Math.floor(s/3600);
  $("cd").textContent=h>99?`${Math.floor(h/24)}d ${h%24}h`:[h,Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,"0")).join(":");
  $("nt").textContent=n.title+" · "+fmt(new Date(n.date));
}

function renderSigs(){
  $("sigs").innerHTML=signals.length?signals.map(s=>`<div class="sig"><span class="${String(s.side).toLowerCase()==="buy"?"buy":"sell"}">${esc(String(s.side).toUpperCase())}</span> ${esc(s.price||"")} <span style="color:var(--mute)">${esc(s.tf?s.tf+"m · ":"")}${esc(s.note||"")} · ${fmt(new Date(s.t*1000))}</span></div>`).join(""):'<div class="msg">No alerts received yet.</div>';
}
fetch("/api/signals").then(r=>r.json()).then(d=>{signals=d;renderSigs();markers()}).catch(()=>{});

const DEFAULTS = [
  {id:"tv", name:"TradingView", url:"https://www.tradingview.com/chart/"},
  {id:"ff", name:"Forex Factory", url:"https://www.forexfactory.com/"}
];

function loadLinks(){
  try{
    const raw=localStorage.getItem("golddesk_links");
    if(raw){
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch{}
  return [...DEFAULTS];
}
function saveLinks(list){ localStorage.setItem("golddesk_links", JSON.stringify(list)); }

let links = loadLinks();
let activeId = links[0]?.id || null;

function renderBar(){
  const bar=$("iframeBar");
  [...bar.querySelectorAll("button[data-id]")].forEach(b=>b.remove());
  const addBtn=$("btnAdd");
  links.forEach(link=>{
    const b=document.createElement("button");
    b.type="button";
    b.dataset.id=link.id;
    b.textContent=link.name;
    if(link.id===activeId) b.setAttribute("aria-pressed","true");
    b.onclick=()=>selectLink(link.id);
    if(!DEFAULTS.some(d=>d.id===link.id)){
      b.title="Right-click to remove";
      b.oncontextmenu=e=>{
        e.preventDefault();
        if(confirm('Remove "'+link.name+'"?')){
          links=links.filter(x=>x.id!==link.id);
          saveLinks(links);
          if(activeId===link.id) activeId=links[0]?.id||null;
          renderBar();
          if(activeId) selectLink(activeId);
        }
      };
    }
    bar.insertBefore(b, addBtn);
  });
}

function selectLink(id){
  const link=links.find(x=>x.id===id);
  if(!link) return;
  activeId=id;
  renderBar();
  const frame=$("deskFrame");
  const fallback=$("frameFallback");
  const flink=$("fallbackLink");
  fallback.classList.remove("show");
  flink.href=link.url;
  flink.textContent="Open "+link.name+" in new tab →";
  frame.src="about:blank";
  setTimeout(()=>{ frame.src=link.url; }, 20);
  setTimeout(()=>{ fallback.classList.add("show"); }, 1800);
}

$("btnAdd").onclick=()=>{ $("addForm").classList.add("show"); $("addName").focus(); };
$("addCancel").onclick=()=>$("addForm").classList.remove("show");
$("addSave").onclick=()=>{
  const name=($("addName").value||"").trim();
  let url=($("addUrl").value||"").trim();
  if(!name || !url){ alert("Name and URL required"); return; }
  if(!/^https?:\/\//i.test(url)) url="https://"+url;
  const id="c_"+Date.now().toString(36);
  links.push({id,name,url});
  saveLinks(links);
  $("addName").value=""; $("addUrl").value="";
  $("addForm").classList.remove("show");
  activeId=id;
  renderBar();
  selectLink(id);
};

renderBar();
if(activeId) selectLink(activeId);

const fsSection = document.querySelector(".iframe-section");
const btnFs = $("btnFs");
function isFs(){
  return document.fullscreenElement === fsSection || document.webkitFullscreenElement === fsSection;
}
function updateFsBtn(){
  btnFs.textContent = isFs() ? "✕ Exit full screen" : "⛶ Full screen";
}
btnFs.onclick = ()=>{
  if(isFs()){
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  } else {
    (fsSection.requestFullscreen||fsSection.webkitRequestFullscreen).call(fsSection);
  }
};
document.addEventListener("fullscreenchange", updateFsBtn);
document.addEventListener("webkitfullscreenchange", updateFsBtn);

async function runConfirm(){
  const side=$("cfSide").value, gran=$("cfGran").value;
  $("cfMeta").textContent="Loading…";
  $("confirmList").innerHTML="";
  try{
    const r=await fetch(`/api/confirm?side=${side}&granularity=${gran}`);
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||r.statusText);
    const dec=d.decision;
    $("cfMeta").innerHTML=`<span class="confirm-decision ${dec}">${dec} ${d.side.toUpperCase()}</span>
      · score ${d.score}/${d.score_max} (${d.score_pct}%)
      · entry ${d.entry} · stop ${d.stop} · tp ${d.target}
      · cats ${d.categories.join(",")||"—"}`;
    $("confirmList").innerHTML=d.checks.map(c=>`
      <div class="chk ${c.ok?"ok":"no"}">
        <span class="mark">${c.ok?"✓":"·"}</span>
        <span><span class="code">${esc(c.code)}</span>${esc(c.desc)}</span>
      </div>`).join("");
  }catch(e){
    $("cfMeta").textContent="Failed: "+(e.message||e);
  }
}
$("cfRun").onclick=runConfirm;

redrawOverlays();
loadCandles(); loadNews();
setInterval(tick,1000); setInterval(loadNews,900000); setInterval(renderNews,60000);
</script>
